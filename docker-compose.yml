services:
  server:
    build: ./server
    container_name: gsmotors-server
    ports:
      # Host 5050 -> container 5000: macOS's AirPlay Receiver squats on host port 5000.
      - "5050:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads
    networks:
      - gsmotors-net

  client:
    build: ./client
    container_name: gsmotors-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5050/api}
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - gsmotors-net

networks:
  gsmotors-net:
    driver: bridge
